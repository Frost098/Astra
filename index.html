<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>Astra Companion</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;overflow:hidden}
#apple-boot{position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .85s cubic-bezier(.4,0,.2,1)}
#apple-boot.done{opacity:0;pointer-events:none}
#apple-boot .logo-wrap{width:86px;height:86px;margin-bottom:56px;opacity:0;transform:scale(.92);animation:bootIn 1.1s cubic-bezier(.22,1,.36,1) .15s forwards}
#apple-boot .logo-wrap svg{width:100%;height:100%;display:block}
#apple-boot .bar-track{width:132px;height:3.5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;opacity:0;animation:bootIn .6s ease .85s forwards}
#apple-boot .bar-fill{height:100%;width:0;border-radius:99px;background:#f5f5f7;animation:bootFill 2.4s cubic-bezier(.4,0,.2,1) 1.05s forwards}
#apple-boot .label{margin-top:32px;font-size:13px;letter-spacing:.06em;color:rgba(245,245,247,.5);opacity:0;animation:bootIn .5s ease 1.3s forwards}
#apple-boot .err{margin-top:20px;font-size:13px;color:#ff6b6b;max-width:280px;text-align:center;display:none}
@keyframes bootIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bootFill{0%{width:0}25%{width:28%}55%{width:62%}80%{width:88%}100%{width:100%}}
</style>
</head>
<body>
<div id="apple-boot">
  <div class="logo-wrap">
    <svg viewBox="0 0 86 86" fill="none"><defs><linearGradient id="ag" x1="10" y1="10" x2="76" y2="76"><stop stop-color="#d4c8ff"/><stop offset="1" stop-color="#7c6af7"/></linearGradient></defs>
    <path d="M43 10c-2.6 8.1-10.1 13.3-18.8 13.3 1.3 8.8 8.2 15.9 16.9 18.1C33.4 33.5 39.7 24.9 43 17.5c4.1 7.4 10.5 16 1.9 24 8.7-2.2 15.6-9.3 16.9-18.1C53.1 23.3 45.6 18.1 43 10z" fill="url(#ag)"/>
    <path d="M26.5 48.5c0 11.2 7.5 20.8 16.5 20.8s16.5-9.6 16.5-20.8c0-1.4-.1-2.7-.4-4-5 4.3-10.7 6.5-16.1 6.5s-11.1-2.2-16.1-6.5c-.3 1.3-.4 2.6-.4 4z" fill="url(#ag)" opacity=".92"/>
    </svg>
  </div>
  <div class="bar-track"><div class="bar-fill"></div></div>
  <div class="label">Astra</div>
  <div class="err" id="boot-err"></div>
</div>
<script>
(async function(){
  const boot=document.getElementById("apple-boot");
  const errEl=document.getElementById("boot-err");
  const min=new Promise(r=>setTimeout(r,2300));
  try{
    let html="";
    for(let i=0;i<8;i++){
      const r=await fetch("./f"+i+".txt?v=30",{cache:"no-store"});
      if(!r.ok) throw new Error("f"+i+" HTTP "+r.status);
      html+=await r.text();
    }
    await min;
    boot.classList.add("done");
    await new Promise(r=>setTimeout(r,650));
    document.open(); document.write(html); document.close();
  }catch(e){
    errEl.style.display="block";
    errEl.textContent="Gagal muat: "+(e&&e.message?e.message:e);
  }
})();
</script>
</body>
</html>
