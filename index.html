<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#000"/>
<title>Astra Companion</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;overflow:hidden}
#b{position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease}
#b.d{opacity:0;pointer-events:none}
.l{width:80px;height:80px;margin-bottom:48px;opacity:0;animation:i 1s ease .2s forwards}
.t{width:120px;height:3px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;animation:i .5s ease .9s forwards}
.f{height:100%;width:0;background:#f5f5f7;border-radius:99px;animation:p 2.3s cubic-bezier(.4,0,.2,1) 1s forwards}
.n{margin-top:28px;font-size:13px;letter-spacing:.05em;color:rgba(245,245,247,.5);opacity:0;animation:i .45s ease 1.3s forwards}
.e{margin-top:18px;color:#ff6b6b;font-size:13px;display:none;max-width:260px;text-align:center}
@keyframes i{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes p{0%{width:0}30%{width:32%}70%{width:78%}100%{width:100%}}
</style>
</head>
<body>
<div id="b">
  <div class="l"><svg viewBox="0 0 80 80" width="80" height="80" fill="none"><defs><linearGradient id="g" x1="8" y1="8" x2="72" y2="72"><stop stop-color="#d4c8ff"/><stop offset="1" stop-color="#7c6af7"/></linearGradient></defs><path d="M40 9c-2.4 7.5-9.4 12.4-17.5 12.4 1.2 8.2 7.6 14.8 15.7 16.8C30.9 30.6 36.7 22.6 40 15.8c3.3 6.8 9.1 14.8 1.8 22.4 8.1-2 14.5-8.6 15.7-16.8C49.4 21.4 42.4 16.5 40 9z" fill="url(#g)"/><path d="M24.5 45c0 10.4 7 19.3 15.5 19.3S55.5 55.4 55.5 45c0-1.3-.1-2.5-.3-3.7-4.6 4-10 6.1-15.2 6.1s-10.6-2.1-15.2-6.1c-.2 1.2-.3 2.4-.3 3.7z" fill="url(#g)" opacity=".9"/></svg></div>
  <div class="t"><div class="f"></div></div>
  <div class="n">Astra</div>
  <div class="e" id="e"></div>
</div>
<script>
(async function(){
  const b=document.getElementById("b"),e=document.getElementById("e");
  const min=new Promise(r=>setTimeout(r,2300));
  try{
    let h="";
    for(let i=0;i<8;i++){
      const r=await fetch("./u"+i+".txt?v=40",{cache:"no-store"});
      if(!r.ok) throw new Error("u"+i+" "+r.status);
      h+=await r.text();
    }
    await min;
    b.classList.add("d");
    await new Promise(r=>setTimeout(r,700));
    document.open();document.write(h);document.close();
  }catch(err){
    e.style.display="block";
    e.textContent="Gagal: "+(err&&err.message?err.message:err);
  }
})();
</script>
</body>
</html>
