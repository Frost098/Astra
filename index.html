<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0b0f"/>
<title>Astra Companion</title>
<style>html,body{margin:0;height:100%;background:#0b0b0f;color:#c4b5fd;font-family:system-ui,sans-serif}
#s{position:fixed;inset:0;display:grid;place-items:center;font:600 14px system-ui}</style>
</head><body>
<div id="s">Memuat Astra…</div>
<script>
(async function(){
  const el=document.getElementById("s");
  try{
    let html="";
    for(let i=0;i<3;i++){
      el.textContent="Modul "+(i+1)+"/3";
      const r=await fetch("./a"+i+".htmlpart?v=2",{cache:"no-store"});
      if(!r.ok) throw new Error("a"+i+" HTTP "+r.status);
      html+=await r.text();
    }
    document.open(); document.write(html); document.close();
  }catch(e){
    el.textContent="Gagal muat: "+(e&&e.message?e.message:e);
  }
})();
</script>
</body></html>
