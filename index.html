<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0b0f"/>
<title>Astra Companion</title>
<style>html,body{margin:0;height:100%;background:#0b0b0f;color:#c4b5fd;font-family:system-ui,sans-serif}
#s{position:fixed;inset:0;display:grid;place-items:center;font:600 14px system-ui;padding:20px;text-align:center}</style>
</head><body>
<div id="s">Memuat Astra…</div>
<script>
(async function(){
  const el=document.getElementById("s");
  try{
    let html="";
    for(let i=0;i<6;i++){
      el.textContent="Modul "+(i+1)+"/6";
      const r=await fetch("./g"+i+".txt?v=5",{cache:"no-store"});
      if(!r.ok) throw new Error("g"+i+" HTTP "+r.status);
      let b64=(await r.text()).replace(/\s+/g,"");
      if(b64.length%4) b64+="=".repeat((4-b64.length%4)%4);
      const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
      const part=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
      html+=part;
    }
    document.open(); document.write(html); document.close();
  }catch(e){
    el.textContent="Gagal muat: "+(e&&e.message?e.message:e);
    console.error(e);
  }
})();
</script>
</body></html>
