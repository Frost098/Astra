<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0d0d0f"/>
<title>Astra Companion</title>
<style>html,body{margin:0;height:100%;background:#0d0d0f;color:#c4b5fd;font-family:system-ui,sans-serif}
#s{position:fixed;inset:0;display:grid;place-items:center;font:600 14px system-ui}</style>
</head><body>
<div id="s">Memuat Astra…</div>
<script>
(async function(){
  const status=m=>{const el=document.getElementById("s");if(el)el.textContent=m};
  try{
    const n=6;
    let b64="";
    for(let i=0;i<n;i++){
      status("Modul "+(i+1)+"/"+n);
      const r=await fetch("./c"+i+".txt?v=3",{cache:"no-store"});
      if(!r.ok) throw new Error("c"+i+" "+r.status);
      b64+=(await r.text()).replace(/\s+/g,"");
    }
    if(b64.length%4!==0) b64+="=".repeat((4-b64.length%4)%4);
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open(); document.write(html); document.close();
  }catch(e){
    status("Gagal: "+(e&&e.message?e.message:e));
    console.error(e);
  }
})();
</script>
</body></html>
