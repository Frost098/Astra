<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>Astra Companion</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;overflow:hidden}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;z-index:9999;transition:opacity .7s ease}
#boot.hide{opacity:0;pointer-events:none}
.bl{width:72px;height:72px;margin-bottom:48px;opacity:0;animation:in 1s ease forwards .15s}
.bbw{width:120px;height:3px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;animation:in .5s ease forwards .9s}
.bb{height:100%;width:0;background:#f5f5f7;border-radius:99px;animation:fill 2.2s cubic-bezier(.4,0,.2,1) forwards 1s}
.bc{margin-top:28px;font-size:13px;letter-spacing:.04em;color:rgba(245,245,247,.55);opacity:0;animation:in .45s ease forwards 1.3s}
.be{margin-top:18px;color:#ff6b6b;font-size:13px;display:none;max-width:280px;text-align:center}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fill{0%{width:0}30%{width:35%}70%{width:78%}100%{width:100%}}
</style></head><body>
<div id="boot">
  <div class="bl"><svg viewBox="0 0 72 72" width="72" height="72" fill="none"><defs><linearGradient id="g" x1="8" y1="8" x2="64" y2="64"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c6af7"/></linearGradient></defs><path d="M36 8c-2.2 6.8-8.5 11.2-15.8 11.2 1.1 7.4 6.9 13.4 14.2 15.2C27.2 27.6 32.5 20.4 36 14.2c3.5 6.2 8.8 13.4 1.6 20.2 7.3-1.8 13.1-7.8 14.2-15.2C44.5 19.2 38.2 14.8 36 8z" fill="url(#g)"/><path d="M22 40.5c0 9.4 6.3 17.5 14 17.5s14-8.1 14-17.5c0-1.2-.1-2.3-.3-3.4-4.2 3.6-9 5.5-13.7 5.5s-9.5-1.9-13.7-5.5c-.2 1.1-.3 2.2-.3 3.4z" fill="url(#g)" opacity=".9"/></svg></div>
  <div class="bbw"><div class="bb"></div></div>
  <div class="bc">Astra</div>
  <div class="be" id="e"></div>
</div>
<script>
(async function(){
  const boot=document.getElementById("boot");
  const min=new Promise(r=>setTimeout(r,2400));
  try{
    const r=await fetch("./g0.txt?v=9",{cache:"no-store"});
    if(!r.ok) throw new Error("g0 HTTP "+r.status);
    let b64=(await r.text()).replace(/\s+/g,"");
    if(b64.length%4) b64+="=".repeat((4-b64.length%4)%4);
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    await min;
    boot.classList.add("hide");
    await new Promise(r=>setTimeout(r,650));
    document.open(); document.write(html); document.close();
  }catch(err){
    document.getElementById("e").style.display="block";
    document.getElementById("e").textContent="Gagal muat: "+(err&&err.message?err.message:err);
  }
})();
</script>
</body></html>
